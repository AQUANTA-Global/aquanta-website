<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact | AQUANTA</title>
<meta name="description" content="Contact AQUANTA Co., Ltd.">
<link rel="canonical" href="https://aquanta.co.jp/contact/">

<link rel="icon" type="image/png" href="/assets/icons/logo1536x1024pix.png?v=2.0.0-20260704163946">

<link rel="stylesheet" href="/assets/css/aquanta-theme.css">
<script defer src="/assets/js/aquanta-core.js"></script>
<style>
.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
}

.form-row label {
    width: 120px;      /* еднаква ширина */
    font-weight: 600;
    color: #ffffff;
}

.form-row input,
.form-row textarea {
    flex: 1;
    padding: 12px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
}

.form-row textarea {
    min-height: 120px;
}
.contact-form {
  display: grid;
  /* Създава две равни колони по 50% ширина */
  grid-template-columns: 1fr 1fr; 
  /* Разстояние между елементите (по избор) */
  gap: 20px; 
}

.field-name {
  grid-column: 1 / 2; /* Разполага се в първата колона */
  grid-row: 1 / 2;    /* Разполага се на първия ред */
}

.field-email {
  grid-column: 1 / 2; /* Разполага се в първата колона */
  grid-row: 2 / 3;    /* Разполага се на втория ред */
}

.field-message {
  grid-column: 2 / 3; /* Разполага се във втората колона */
  grid-row: 1 / 3;    /* Обединява първия и втория ред */
  display: flex;
  flex-direction: column;
}

/* Настройки, за да може текстовото поле да запълни цялата височина на двата реда */
.field-message textarea {
  flex-grow: 1;
  resize: vertical; 
}
.submit-btn {

```
background:
    linear-gradient(
        90deg,
        var(--accent-blue),
        var(--accent-rose));

color: white;

border: none;

padding: 15px 40px;

border-radius: 40px;

cursor: pointer;

font-weight: 600;

transition: .3s;
```

}

.submit-btn:hover {

```
transform: translateY(-2px);

box-shadow:
    0 8px 25px rgba(42,168,224,0.35);
```

}
</style>
</head>
<body>
  <div data-header></div>
  <main class="page-shell">
    <section class="card">
      <p class="lead">For research, publications, consortium and collaboration inquiries.</p>
      <p class="eyebrow">Contact AQUANTA Co., Ltd.</p>
    </section>
	<section class="content">
		<div class="container contact-grid">
			<div class="content-card">
				<section class="contact-section">
					<div class="contact-card">
						<h2>Contact Us</h2>
						<form class="contact-form" id="contactForm">
							<div class="field-name">
								<label for="name">Name</label>
								<input
									type="text"
									id="name"
									name="name"
									placeholder="Your Name"
									required>
							</div>

							<div class="field-email">
								<label for="email">Email</label>
								<input
									type="email"
									id="email"
									name="email"
									placeholder="your@email.com"
									required>
							</div>

							<div class="field-message">
								<label for="message">Message</label>
								<textarea
									id="message"
									name="message"
									placeholder="Write your message here..."
									required>
								</textarea>
							</div>

							<button type="submit" class="submit-btn">
								Submit
							</button>

							<div id="formResponse"></div>
						</form>
					</div>
				</section>
			</p>
			</div>
		</div>
	</section>
<!-- Този контейнер ще бъде запълнен динамично от JS -->
    <div data-particles  class="page-hero"></div>
  </main>
  <div data-footer></div>
</body>
</html>
