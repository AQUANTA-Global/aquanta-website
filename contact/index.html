<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact | AQUANTA</title>
<meta name="description" content="Contact AQUANTA Co., Ltd.">
<link rel="canonical" href="https://aquanta.co.jp/contact/">

<link rel="icon" type="image/png" href="/assets/icons/logo1536x1024pix.png?v=2.0.0-20260704163946">

<link rel="stylesheet" href="/assets/css/aquanta-theme.css">
<script defer src="/assets/js/aquanta-core.js"></script>
<style>
.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
}

.form-row label {
    width: 120px;      /* еднаква ширина */
    font-weight: 600;
    color: #ffffff;
}

.form-row input,
.form-row textarea {
    flex: 1;
    padding: 12px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
}

.form-row textarea {
    min-height: 120px;
}
</style>
</head>
<body>
  <div data-header></div>
  <main class="page-shell">
    <section class="card">
      <p class="eyebrow">AQUANTA</p>
      <h1>Contact</h1>
      <p class="lead">Contact AQUANTA Co., Ltd.</p>
    </section>
	<div class="container">
		<h1>Join the Exploration</h1>
		<p class="lead">For research, publications, consortium and collaboration inquiries.</p>
	</div>
	<section class="content">
		<div class="container contact-grid">
			<div class="content-card">
			<h2>AQUANTA</h2>
			<p>Scientific and technological development based on aquaphotomics.</p>
			</div>
			<div class="content-card">
				<section class="contact-section">
					<div class="contact-card">
						<h2>Contact Us</h2>
						<form id="contactForm">
							<div class="form-row">
								<label for="name">Name</label>
								<input
									type="text"
									id="name"
									name="name"
									placeholder="Your Name"
									required>
							</div>

							<div class="form-row">
								<label for="email">Email</label>
								<input
									type="email"
									id="email"
									name="email"
									placeholder="your@email.com"
									required>
							</div>

							<div class="form-row">
								<label for="message">Message</label>
								<textarea
									id="message"
									name="message"
									rows="6"
									placeholder="Write your message here..."
									required>
								</textarea>
							</div>

							<button type="submit" class="submit-btn">
								Submit
							</button>

							<div id="formResponse"></div>
						</form>
					</div>
				</section>
			</p>
			</div>
		</div>
	</section>
<!-- Този контейнер ще бъде запълнен динамично от JS -->
    <div data-particles  class="page-hero"></div>
  </main>
  <div data-footer></div>
</body>
</html>
